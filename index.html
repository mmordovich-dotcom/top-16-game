<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 16 Tournament Judge System</title>
  <!-- Подключаем сверхнадежный клиент MQTT вместо PeerJS -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-a: #ec4899;
      --accent-b: #3b82f6;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    #mode-select { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; text-align: center; padding: 20px;}
    .btn { background: #6366f1; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-a { background: var(--accent-a); }
    .btn-b { background: var(--accent-b); }

    #host-view { display: none; padding: 20px; flex-direction: column; gap: 20px; }
    .host-header { display: flex; flex-direction: column; align-items: center; background: var(--card-bg); padding: 20px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid var(--border); text-align: center; }
    
    /* Эффект жидкого стекла */
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    
    .match-arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; padding: 30px; border-radius: 20px; }
    .candidate-card { text-align: center; padding: 20px; border-radius: 16px; background: rgba(255,255,255,0.03); }
    .candidate-card.a { border-top: 4px solid var(--accent-a); }
    .candidate-card.b { border-top: 4px solid var(--accent-b); }
    .score-display { font-size: 4rem; font-weight: 800; margin-top: 10px; }
    .vs { font-size: 2rem; font-weight: 900; color: #94a3b8; }
    
    .judges-status { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .judge-badge { padding: 8px 16px; border-radius: 20px; background: #334155; font-size: 0.9rem; transition: 0.3s; }
    .judge-badge.voted { background: #10b981; color: white; transform: scale(1.05); }

    .bracket { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; overflow-x: auto; padding-bottom: 10px;}
    .bracket-round { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-width: 150px; }
    .match-node { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; text-align: center; transition: 0.3s; backdrop-filter: blur(10px); }
    .match-node.active { border-color: #6366f1; box-shadow: 0 0 12px rgba(99,102,241,0.5); background: rgba(99,102,241, 0.1); }

    #judge-view { display: none; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; }
    .param-group { margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 12px; backdrop-filter: blur(10px); }
    .param-title { font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .score-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .score-btn { background: #334155; color: white; border: none; padding: 15px 0; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
    .score-btn.active { background: #6366f1; transform: scale(1.05); }
    
    input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 10px; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="mode-select">
    <h1>Турнир TOP 16</h1>
    <p>Выберите роль устройства:</p>
    <button class="btn" onclick="initHost()">📺 Главный экран (Экран #4)</button>
    <button class="btn btn-b" onclick="showConnect()">📱 Пульт Судьи (Экраны #1-3)</button>
    
    <div id="connect-box" style="display:none; margin-top: 20px; width: 100%; max-width: 300px;">
      <input type="text" id="host-id-input" placeholder="ПИН-код Комнаты">
      <input type="text" id="judge-name-input" placeholder="Имя/Номер Судьи (1, 2, 3)">
      <button class="btn btn-a" style="width: 100%;" onclick="initJudge()">Подключиться</button>
    </div>
  </div>

  <div id="host-view">
    <div class="host-header">
      <h2 style="margin-bottom: 10px;">Сетка TOP 16</h2>
      <div style="margin-bottom: 15px; font-size: 1.2rem;">ПИН-код: <strong id="room-id" style="color: #6366f1; font-size: 1.8rem;">...</strong></div>
      <img id="qr-code" style="display: none; border-radius: 12px; border: 4px solid white; width: 160px; height: 160px;" alt="QR Code">
      <p id="qr-hint" style="display: none; font-size: 0.95rem; margin-top: 15px; color: #94a3b8;">Отсканируйте камерой, чтобы присоединиться</p>
    </div>

    <div class="match-arena glass">
      <div class="candidate-card a">
        <h3 id="cand-a-name">Кандидат A</h3>
        <div class="score-display" id="cand-a-score">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="candidate-card b">
        <h3 id="cand-b-name">Кандидат B</h3>
        <div class="score-display" id="cand-b-score">0</div>
      </div>
    </div>

    <div class="judges-status">
      <div class="judge-badge" id="j1-status">Судья 1</div>
      <div class="judge-badge" id="j2-status">Судья 2</div>
      <div class="judge-badge" id="j3-status">Судья 3</div>
    </div>

    <div style="text-align: center; margin-top: 10px;">
      <button class="btn btn-a" onclick="nextMatch()" style="padding: 16px 32px; font-size: 1.2rem;">Завершить раунд / Следующий матч</button>
    </div>

    <div class="bracket" id="bracket-grid"></div>
  </div>

  <div id="judge-view">
    <h2 id="match-title" style="text-align:center; margin-bottom:20px;">Оценка матча</h2>
    <div id="evaluation-forms" style="text-align: center; color: #94a3b8;">Подключение к экрану...</div>
    <button class="btn btn-a" id="submit-btn" style="width: 100%; margin-top: 20px; font-size: 1.2rem; padding: 16px;" onclick="submitVotes()">Отправить Голос</button>
  </div>

  <script>
    let client = null;
    let currentMatch = { round: 0, index: 0 };
    let votes = {};
    let myRoomId = '';

    const parameters = ["Техника / Навык", "Артистизм / Стиль", "Впечатление"];
    let candidates = Array.from({length: 16}, (_, i) => `Кандидат ${i+1}`);
    let bracket = [
      Array.from({length: 8}, (_, i) => [candidates[i*2], candidates[i*2+1]]),
      Array.from({length: 4}, () => ['', '']),
      Array.from({length: 2}, () => ['', '']),
      [['', '']]
    ];

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomFromQR = urlParams.get('room');
      if (roomFromQR) {
        document.getElementById('host-id-input').value = roomFromQR;
        showConnect();
      }
    };

    function showConnect() {
      document.getElementById('connect-box').style.display = 'flex';
      document.getElementById('connect-box').style.flexDirection = 'column';
      document.getElementById('connect-box').style.gap = '10px';
    }

    // --- HOST LOGIC ---
    function initHost() {
      document.getElementById('mode-select').style.display = 'none';
      document.getElementById('host-view').style.display = 'flex';
      
      renderBracket();
      createNetwork();
    }

    function createNetwork() {
      // Генерируем простой цифровой ПИН-код (4 цифры)
      myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
      
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      client.on('connect', () => {
        document.getElementById('room-id').innerText = myRoomId;
        client.subscribe(`top16/room/${myRoomId}/votes`);
        
        const joinUrl = window.location.href.split('?')[0] + '?room=' + myRoomId;
        const qrImg = document.getElementById('qr-code');
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(joinUrl);
        qrImg.style.display = 'block';
        document.getElementById('qr-hint').style.display = 'block';

        updateCurrentMatch();
      });

      client.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.type === 'VOTE') {
            votes[data.judgeId] = data.scores;
            markJudgeVoted(data.judgeId);
            calculateScores();
          }
        } catch(e) {}
      });
    }

    function renderBracket() {
      const container = document.getElementById('bracket-grid');
      container.innerHTML = '';
      bracket.forEach((round, rIdx) => {
        const roundEl = document.createElement('div');
        roundEl.className = 'bracket-round';
        round.forEach((m, mIdx) => {
          const node = document.createElement('div');
          node.className = `match-node ${rIdx === currentMatch.round && mIdx === currentMatch.index ? 'active' : ''}`;
          node.innerText = `${m[0] || '?'} vs ${m[1] || '?'}`;
          roundEl.appendChild(node);
        });
        container.appendChild(roundEl);
      });
    }

    function updateCurrentMatch() {
      const match = bracket[currentMatch.round][currentMatch.index];
      document.getElementById('cand-a-name').innerText = match[0] || 'TBD';
      document.getElementById('cand-b-name').innerText = match[1] || 'TBD';
      document.getElementById('cand-a-score').innerText = '0';
      document.getElementById('cand-b-score').innerText = '0';
      votes = {};
      resetJudgeBadges();
      
      if (client && client.connected) {
        // retain: true - если судья закроет и откроет браузер, он сразу увидит текущий матч
        client.publish(`top16/room/${myRoomId}/host`, JSON.stringify({ type: 'NEW_MATCH', match: match }), { retain: true });
      }
      renderBracket();
    }

    function markJudgeVoted(id) {
      const badges = document.querySelectorAll('.judge-badge');
      badges.forEach(b => {
        if (b.innerText.includes(id)) b.classList.add('voted');
      });
    }

    function resetJudgeBadges() {
      document.querySelectorAll('.judge-badge').forEach(b => b.classList.remove('voted'));
    }

    function calculateScores() {
      let scoreA = 0, scoreB = 0;
      Object.values(votes).forEach(v => {
        scoreA += v.a.reduce((sum, val) => sum + val, 0);
        scoreB += v.b.reduce((sum, val) => sum + val, 0);
      });
      document.getElementById('cand-a-score').innerText = scoreA;
      document.getElementById('cand-b-score').innerText = scoreB;
    }

    function nextMatch() {
      const scoreA = parseInt(document.getElementById('cand-a-score').innerText);
      const scoreB = parseInt(document.getElementById('cand-b-score').innerText);
      const match = bracket[currentMatch.round][currentMatch.index];
      const winner = scoreA >= scoreB ? match[0] : match[1];

      if (currentMatch.round < 3) {
        const nextRoundIndex = Math.floor(currentMatch.index / 2);
        const candSlot = currentMatch.index % 2;
        bracket[currentMatch.round + 1][nextRoundIndex][candSlot] = winner;
      }

      if (currentMatch.index < bracket[currentMatch.round].length - 1) {
        currentMatch.index++;
      } else if (currentMatch.round < 3) {
        currentMatch.round++;
        currentMatch.index = 0;
      } else {
        alert(`Победитель Турнира: ${winner}!`);
        return;
      }
      updateCurrentMatch();
    }

    // --- JUDGE LOGIC ---
    let judgeId = '';
    let currentVote = { a: [1,1,1], b: [1,1,1] };

    function initJudge() {
      myRoomId = document.getElementById('host-id-input').value.trim();
      judgeId = document.getElementById('judge-name-input').value.trim();

      if (!myRoomId) return alert('ID комнаты не найден');
      if (!judgeId) return alert('Введите ваш номер или имя');

      document.getElementById('mode-select').style.display = 'none';
      document.getElementById('judge-view').style.display = 'block';

      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      client.on('connect', () => {
        client.subscribe(`top16/room/${myRoomId}/host`);
      });

      client.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.type === 'NEW_MATCH') {
            buildJudgeUI(data.match);
          }
        } catch(e) {}
      });
    }

    function buildJudgeUI(match) {
      currentVote = { a: [1,1,1], b: [1,1,1] };
      const container = document.getElementById('evaluation-forms');
      document.getElementById('match-title').innerText = `${match[0]} vs ${match[1]}`;
      container.innerHTML = '';

      ['a', 'b'].forEach((candKey, cIdx) => {
        const candName = match[cIdx];
        const header = document.createElement('h3');
        header.style.color = candKey === 'a' ? 'var(--accent-a)' : 'var(--accent-b)';
        header.style.margin = '20px 0 10px 0';
        header.innerText = `Оценка: ${candName || 'Кандидат'}`;
        container.appendChild(header);

        parameters.forEach((param, pIdx) => {
          const group = document.createElement('div');
          group.className = 'param-group';
          group.innerHTML = `<div class="param-title"><span>${param}</span><span id="val-${candKey}-${pIdx}" style="color: #6366f1;">1</span></div>`;
          
          const btnGrid = document.createElement('div');
          btnGrid.className = 'score-buttons';

          for (let val = 1; val <= 5; val++) {
            const btn = document.createElement('button');
            btn.className = `score-btn ${val === 1 ? 'active' : ''}`;
            btn.innerText = val;
            btn.onclick = () => {
              btnGrid.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              currentVote[candKey][pIdx] = val;
              document.getElementById(`val-${candKey}-${pIdx}`).innerText = val;
            };
            btnGrid.appendChild(btn);
          }
          group.appendChild(btnGrid);
          container.appendChild(group);
        });
      });
    }

    function submitVotes() {
      if (client && client.connected) {
        const data = { type: 'VOTE', judgeId: judgeId, scores: currentVote };
        client.publish(`top16/room/${myRoomId}/votes`, JSON.stringify(data));
        
        // Визуальная обратная связь для судьи (кнопка зеленеет)
        const btn = document.getElementById('submit-btn');
        const originalText = btn.innerText;
        btn.innerText = 'Оценки отправлены!';
        btn.style.background = '#10b981';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = 'var(--accent-a)';
        }, 1500);
      } else {
        alert('Нет соединения с сервером');
      }
    }
  </script>
</body>
</html>
