<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 16 Tournament Judge System</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-a: #ec4899;
      --accent-b: #3b82f6;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    #mode-select { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; text-align: center; }
    .btn { background: #6366f1; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-a { background: var(--accent-a); }
    .btn-b { background: var(--accent-b); }

    #host-view { display: none; padding: 20px; flex-direction: column; gap: 20px; }
    .host-header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 25px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid var(--border); }
    .match-arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; background: var(--card-bg); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid var(--border); }
    .candidate-card { text-align: center; padding: 20px; border-radius: 16px; background: rgba(255,255,255,0.03); }
    .candidate-card.a { border-top: 4px solid var(--accent-a); }
    .candidate-card.b { border-top: 4px solid var(--accent-b); }
    .score-display { font-size: 4rem; font-weight: 800; margin-top: 10px; }
    .vs { font-size: 2rem; font-weight: 900; color: #94a3b8; }
    
    .judges-status { display: flex; justify-content: center; gap: 15px; }
    .judge-badge { padding: 8px 16px; border-radius: 20px; background: #334155; font-size: 0.9rem; }
    .judge-badge.voted { background: #10b981; color: white; }

    .bracket { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
    .bracket-round { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
    .match-node { background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.85rem; }
    .match-node.active { border-color: #6366f1; box-shadow: 0 0 10px rgba(99,102,241,0.3); }

    #judge-view { display: none; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; }
    .param-group { margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 12px; }
    .param-title { font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .score-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .score-btn { background: #334155; color: white; border: none; padding: 12px 0; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .score-btn.active { background: #6366f1; }
    
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #1e293b; color: white; margin-bottom: 10px; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="mode-select">
    <h1>Турнир TOP 16</h1>
    <p>Выберите роль устройства:</p>
    <button class="btn" onclick="initHost()">📺 Главный экран (Экран #4)</button>
    <button class="btn btn-b" onclick="showConnect()">📱 Пульт Судьи (Экраны #1-3)</button>
    
    <div id="connect-box" style="display:none; margin-top: 20px;">
      <input type="text" id="host-id-input" placeholder="Введите ID Комнаты с экрана">
      <input type="text" id="judge-name-input" placeholder="Имя/Номер Судьи (1, 2 или 3)">
      <button class="btn btn-a" onclick="initJudge()">Подключиться</button>
    </div>
  </div>

  <div id="host-view">
    <div class="host-header">
      <h2>Сетка TOP 16</h2>
      <div>ID Комнаты для судей: <strong id="room-id" style="color: #6366f1;">Подключение...</strong> <button onclick="createPeerHost()" style="margin-left: 10px; padding: 4px 8px; font-size: 0.8rem;">Обновить ID</button></div>
    </div>

    <div class="match-arena">
      <div class="candidate-card a">
        <h3 id="cand-a-name">Кандидат A</h3>
        <div class="score-display" id="cand-a-score">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="candidate-card b">
        <h3 id="cand-b-name">Кандидат B</h3>
        <div class="score-display" id="cand-b-score">0</div>
      </div>
    </div>

    <div class="judges-status">
      <div class="judge-badge" id="j1-status">Судья 1</div>
      <div class="judge-badge" id="j2-status">Судья 2</div>
      <div class="judge-badge" id="j3-status">Судья 3</div>
    </div>

    <div style="text-align: center; margin-top: 10px;">
      <button class="btn btn-a" onclick="nextMatch()">Завершить раунд / Следующий матч</button>
    </div>

    <div class="bracket" id="bracket-grid"></div>
  </div>

  <div id="judge-view">
    <h2 id="match-title" style="text-align:center; margin-bottom:20px;">Оценка матча</h2>
    <div id="evaluation-forms">Ожидание начала матча...</div>
    <button class="btn btn-a" style="width: 100%; margin-top: 20px;" onclick="submitVotes()">Отправить Голос</button>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let currentMatch = { round: 0, index: 0 };
    let votes = {};

    const parameters = ["Техника / Навык", "Артистизм / Стиль", "Впечатление"];
    let candidates = Array.from({length: 16}, (_, i) => `Кандидат ${i+1}`);
    let bracket = [
      Array.from({length: 8}, (_, i) => [candidates[i*2], candidates[i*2+1]]),
      Array.from({length: 4}, () => ['', '']),
      Array.from({length: 2}, () => ['', '']),
      [['', '']]
    ];

    function showConnect() {
      document.getElementById('connect-box').style.display = 'block';
    }

    // --- HOST LOGIC ---
    function initHost() {
      document.getElementById('mode-select').style.display = 'none';
      document.getElementById('host-view').style.display = 'flex';
      
      renderBracket();
      updateCurrentMatch();
      createPeerHost();
    }

    function createPeerHost() {
      document.getElementById('room-id').innerText = 'Генерация...';
      if (peer) peer.destroy();

      // Генерация случайного короткого ID
      const customId = 'top16-' + Math.floor(1000 + Math.random() * 9000);

      peer = new Peer(customId, {
        debug: 1,
        config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        }
      });

      peer.on('open', id => {
        document.getElementById('room-id').innerText = id;
      });

      peer.on('error', err => {
        console.error(err);
        document.getElementById('room-id').innerText = 'Ошибка соединения. Нажмите "Обновить ID"';
      });

      peer.on('connection', conn => {
        connections.push(conn);
        conn.on('data', data => handleJudgeData(data));
        // Отправляем текущий матч при подключении
        setTimeout(() => {
          conn.send({ type: 'NEW_MATCH', match: bracket[currentMatch.round][currentMatch.index] });
        }, 500);
      });
    }

    function renderBracket() {
      const container = document.getElementById('bracket-grid');
      container.innerHTML = '';
      bracket.forEach((round, rIdx) => {
        const roundEl = document.createElement('div');
        roundEl.className = 'bracket-round';
        round.forEach((m, mIdx) => {
          const node = document.createElement('div');
          node.className = `match-node ${rIdx === currentMatch.round && mIdx === currentMatch.index ? 'active' : ''}`;
          node.innerText = `${m[0] || '?'} vs ${m[1] || '?'}`;
          roundEl.appendChild(node);
        });
        container.appendChild(roundEl);
      });
    }

    function updateCurrentMatch() {
      const match = bracket[currentMatch.round][currentMatch.index];
      document.getElementById('cand-a-name').innerText = match[0] || 'TBD';
      document.getElementById('cand-b-name').innerText = match[1] || 'TBD';
      document.getElementById('cand-a-score').innerText = '0';
      document.getElementById('cand-b-score').innerText = '0';
      votes = {};
      resetJudgeBadges();
      broadcast({ type: 'NEW_MATCH', match: match });
      renderBracket();
    }

    function handleJudgeData(data) {
      if (data.type === 'VOTE') {
        votes[data.judgeId] = data.scores;
        markJudgeVoted(data.judgeId);
        calculateScores();
      }
    }

    function markJudgeVoted(id) {
      const badges = document.querySelectorAll('.judge-badge');
      badges.forEach(b => {
        if (b.innerText.includes(id)) b.classList.add('voted');
      });
    }

    function resetJudgeBadges() {
      document.querySelectorAll('.judge-badge').forEach(b => b.classList.remove('voted'));
    }

    function calculateScores() {
      let scoreA = 0, scoreB = 0;
      Object.values(votes).forEach(v => {
        scoreA += v.a.reduce((sum, val) => sum + val, 0);
        scoreB += v.b.reduce((sum, val) => sum + val, 0);
      });
      document.getElementById('cand-a-score').innerText = scoreA;
      document.getElementById('cand-b-score').innerText = scoreB;
    }

    function nextMatch() {
      const scoreA = parseInt(document.getElementById('cand-a-score').innerText);
      const scoreB = parseInt(document.getElementById('cand-b-score').innerText);
      const match = bracket[currentMatch.round][currentMatch.index];
      const winner = scoreA >= scoreB ? match[0] : match[1];

      if (currentMatch.round < 3) {
        const nextRoundIndex = Math.floor(currentMatch.index / 2);
        const candSlot = currentMatch.index % 2;
        bracket[currentMatch.round + 1][nextRoundIndex][candSlot] = winner;
      }

      if (currentMatch.index < bracket[currentMatch.round].length - 1) {
        currentMatch.index++;
      } else if (currentMatch.round < 3) {
        currentMatch.round++;
        currentMatch.index = 0;
      } else {
        alert(`Победитель Турнира: ${winner}!`);
        return;
      }
      updateCurrentMatch();
    }

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    // --- JUDGE LOGIC ---
    let judgeId = '';
    let conn = null;
    let currentVote = { a: [1,1,1], b: [1,1,1] };

    function initJudge() {
      const hostId = document.getElementById('host-id-input').value.trim();
      judgeId = document.getElementById('judge-name-input').value.trim() || 'Judge';

      if (!hostId) return alert('Введите ID Хоста');

      document.getElementById('mode-select').style.display = 'none';
      document.getElementById('judge-view').style.display = 'block';

      peer = new Peer({
        config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        }
      });

      peer.on('open', () => {
        conn = peer.connect(hostId);
        
        conn.on('open', () => {
          console.log('Подключено к хосту!');
        });

        conn.on('data', data => {
          if (data.type === 'NEW_MATCH') {
            buildJudgeUI(data.match);
          }
        });
      });

      peer.on('error', err => {
        alert('Ошибка подключения к комнате: ' + err.type);
      });
    }

    function buildJudgeUI(match) {
      currentVote = { a: [1,1,1], b: [1,1,1] };
      const container = document.getElementById('evaluation-forms');
      document.getElementById('match-title').innerText = `${match[0]} vs ${match[1]}`;
      container.innerHTML = '';

      ['a', 'b'].forEach((candKey, cIdx) => {
        const candName = match[cIdx];
        const header = document.createElement('h3');
        header.style.color = candKey === 'a' ? 'var(--accent-a)' : 'var(--accent-b)';
        header.style.margin = '15px 0 10px 0';
        header.innerText = `Оценка: ${candName || 'Кандидат'}`;
        container.appendChild(header);

        parameters.forEach((param, pIdx) => {
          const group = document.createElement('div');
          group.className = 'param-group';
          group.innerHTML = `<div class="param-title"><span>${param}</span><span id="val-${candKey}-${pIdx}">1</span></div>`;
          
          const btnGrid = document.createElement('div');
          btnGrid.className = 'score-buttons';

          for (let val = 1; val <= 5; val++) {
            const btn = document.createElement('button');
            btn.className = `score-btn ${val === 1 ? 'active' : ''}`;
            btn.innerText = val;
            btn.onclick = () => {
              btnGrid.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              currentVote[candKey][pIdx] = val;
              document.getElementById(`val-${candKey}-${pIdx}`).innerText = val;
            };
            btnGrid.appendChild(btn);
          }
          group.appendChild(btnGrid);
          container.appendChild(group);
        });
      });
    }

    function submitVotes() {
      if (conn && conn.open) {
        conn.send({ type: 'VOTE', judgeId: judgeId, scores: currentVote });
        alert('Голос отправлен!');
      } else {
        alert('Нет соединения с главным экраном');
      }
    }
  </script>
</body>
</html>
